services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
      POSTGRES_DB: incident
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incident"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://incident:incident@db:5432/incident
      TEST_DATABASE_URL: postgresql+psycopg://incident:incident@db:5432/incident_test
      CORS_ORIGINS: http://localhost:5173
      # Демо-инциденты на старте (TASK.md §6): включается явно, по умолчанию
      # выключено. Переопределяется из окружения/`.env`: SEED_DEMO=true.
      SEED_DEMO: ${SEED_DEMO:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Миграции выполняются в entrypoint перед стартом uvicorn, поэтому
    # healthcheck отдаёт 200 только после `alembic upgrade head`.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # Не VITE_*: внутренний адрес backend нужен только dev-серверу (прокси),
      # в браузерный JS он не должен попадать.
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  db_data: