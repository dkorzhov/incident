name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: incident
          POSTGRES_PASSWORD: incident
          POSTGRES_DB: incident_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Backend not scaffolded yet
        if: hashFiles('backend/requirements.txt') == ''
        run: echo "backend/ отсутствует — пропускаем до scaffold-задачи"
      - uses: actions/setup-python@v5
        if: hashFiles('backend/requirements.txt') != ''
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        if: hashFiles('backend/requirements.txt') != ''
        run: pip install -r backend/requirements.txt
      - name: Lint + tests
        if: hashFiles('backend/requirements.txt') != ''
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://incident:incident@localhost:5432/incident_test
        run: |
          ruff check .
          alembic upgrade head
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Frontend not scaffolded yet
        if: hashFiles('frontend/package.json') == ''
        run: echo "frontend/ отсутствует — пропускаем до scaffold-задачи"
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package.json') != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check + test + build
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test
          npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: E2E not scaffolded yet
        if: hashFiles('e2e/package.json') == ''
        run: echo "e2e/ отсутствует — пропускаем до scaffold-задачи"
      - uses: actions/setup-node@v4
        if: hashFiles('e2e/package.json') != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Run stack
        if: hashFiles('e2e/package.json') != ''
        run: |
          docker compose up -d --build
          npx --yes wait-on@9.5.1 http-get://localhost:8000/api/health http-get://localhost:5173 --timeout 180000
      - name: Compose commands from AGENTS.md
        if: hashFiles('e2e/package.json') != ''
        run: |
          docker compose exec -T backend alembic upgrade head
          docker compose exec -T backend ruff check .
          docker compose exec -T backend pytest
      - name: Cache script syntax + host check (DMI-12)
        if: hashFiles('scripts/clean-caches.sh') != ''
        run: |
          bash -n scripts/clean-caches.sh
          scripts/clean-caches.sh --check
      - name: No caches leaked into worktree (DMI-12)
        if: hashFiles('e2e/package.json') != ''
        run: |
          # Образ выносит кэши в /tmp: в смонтированном worktree их быть не должно.
          test -z "$(docker compose exec -T backend sh -c 'ls -d /app/.pytest_cache /app/.ruff_cache 2>/dev/null')"
      - name: Playwright
        if: hashFiles('e2e/package.json') != ''
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Compose logs on failure
        if: failure() && hashFiles('e2e/package.json') != ''
        run: |
          docker compose ps
          docker compose logs --tail=200
